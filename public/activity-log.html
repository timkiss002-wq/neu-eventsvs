<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhật ký thao tác – NEU Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/img/favicon-neu.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/ui.css">
<link rel="stylesheet" href="/css/enhance.css">
<link rel="stylesheet" href="/css/system.css">
</head>
<body>

<!-- Sidebar & header được dựng bởi /js/app.js theo tài khoản đăng nhập -->
<aside class="sidebar" aria-label="Điều hướng chính"></aside>
<div class="scrim" id="scrim"></div>
<header class="header"></header>

<div class="main">
  <main class="container">
    <div class="crumbs">NEU Events <span>/</span> Văn phòng Đoàn <span>/</span> <b>Nhật ký thao tác</b></div>
    <div class="page-head">
      <div>
        <h1>Nhật ký thao tác</h1>
        <p>Lịch sử các thao tác trên hệ thống: nộp và duyệt hồ sơ sự kiện, ấn phẩm, điểm danh, điểm Đoàn, tài khoản – kèm người thực hiện, thời gian và lý do.</p>
      </div>
    </div>
    <section class="card">
      <div class="filters" style="margin-top:0">
        <div class="search"><input type="text" id="kw" placeholder="Tìm nội dung, người thực hiện"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg></div>
        <select class="select" id="fGroup" aria-label="Nhóm thao tác">
          <option value="">Tất cả thao tác</option><option value="event">Hồ sơ sự kiện & ấn phẩm</option><option value="attendance">Đăng ký & điểm danh</option>
          <option value="points">Điểm Đoàn</option><option value="account">Tài khoản & đăng nhập</option>
        </select>
        <input class="select" type="date" id="fFrom" aria-label="Từ ngày">
        <input class="select" type="date" id="fTo" aria-label="Đến ngày">
      </div>
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr><th style="width:16%">Thời gian</th><th style="width:22%">Người thực hiện</th><th>Nội dung</th></tr></thead>
          <tbody id="rows"><tr><td colspan="3"><div class="loading"><span class="spinner"></span></div></td></tr></tbody>
        </table>
      </div>
      <div class="table-foot"><div class="count" id="count"></div><div class="pager" id="pager"></div></div>
    </section>
  </main>
  <footer class="footer"></footer>
</div>

<script src="/js/app.js"></script>
<script src="/js/pages/activity-log.js"></script>
</body>
</html>
